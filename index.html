<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Méthodologie VCS — navigation par étape</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Times New Roman", Times, serif;
    margin: 0;
    padding: 24px;
    background: #ffffff;
    color: #1a1a1a;
    line-height: 1.5;
  }
  .header {
    max-width: 1100px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #003A70;
    padding-bottom: 14px;
  }
  .header .logo {
    height: 48px;
    width: auto;
  }
  .header .subtitle {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #003A70;
    text-align: right;
  }
  .wrap {
    display: flex;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .sidebar {
    flex: 0 0 260px;
  }
  .sidebar-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #003A70;
    margin-bottom: 10px;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }
  .step-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 6px;
    border: 1px solid #99b3c9;
    background: #ffffff;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
  }
  .step-btn:hover {
    background: #eaf1f8;
    border-color: #003A70;
  }
  .step-btn.active {
    background: #003A70;
    color: #ffffff;
    border-color: #003A70;
  }
  .content {
    flex: 1;
    min-width: 0;
    border: 1px solid #99b3c9;
    padding: 28px 32px;
  }
  .content h1 {
    font-size: 22px;
    font-weight: bold;
    margin: 0 0 4px;
    color: #003A70;
  }
  .content .num {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #1a1a1a;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 18px;
  }
  .block {
    margin-bottom: 22px;
  }
  .block h2 {
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    color: #003A70;
    border-bottom: 2px solid #003A70;
    padding-bottom: 4px;
    margin: 0 0 10px;
  }
  .block h3 {
    font-size: 14px;
    font-weight: bold;
    margin: 12px 0 6px;
    color: #003A70;
  }
  .block p, .block li {
    font-size: 15px;
    margin: 0 0 6px;
    color: #1a1a1a;
  }
  .block ul {
    margin: 0 0 8px;
    padding-left: 20px;
  }
  .formula {
    font-family: "Cambria Math", "Times New Roman", serif;
    font-style: italic;
    background: #eaf1f8;
    border-left: 3px solid #003A70;
    padding: 8px 12px;
    margin: 6px 0 10px;
    color: #1a1a1a;
  }
  .doc-link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    margin-left: 4px;
    border-radius: 50%;
    border: 1px solid #003A70;
    background: #ffffff;
    color: #003A70;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    vertical-align: middle;
  }
  .doc-link-btn:hover {
    background: #003A70;
    color: #ffffff;
  }
  .formula-def {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #555;
    margin: -4px 0 14px;
  }
  .upper {
    text-transform: uppercase;
    color: #003A70;
  }
  .scoring-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .scoring-table th, .scoring-table td {
    border: 1px solid #99b3c9;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
    color: #1a1a1a;
  }
  .scoring-table thead th {
    background: #003A70;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .scoring-table tbody tr:nth-child(even) {
    background: #eaf1f8;
  }
  .decision {
    border: 2px solid #003A70;
    background: #eaf1f8;
    padding: 12px 16px;
  }
  .decision p {
    color: #003A70;
    font-weight: bold;
  }
  .empty {
    font-size: 15px;
    color: #666;
    font-style: italic;
  }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    font-family: Arial, sans-serif;
  }
  .nav-buttons button {
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid #003A70;
    background: #ffffff;
    color: #003A70;
    cursor: pointer;
  }
  .nav-buttons button:hover:not(:disabled) {
    background: #003A70;
    color: #ffffff;
  }
  .nav-buttons button:disabled {
    opacity: 0.3;
    cursor: default;
  }
</style>
</head>

let current = 0;

function renderList() {
  const list = document.getElementById('stepList');
  list.innerHTML = '';
  steps.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'step-btn' + (i === current ? ' active' : '');
    btn.textContent = s.num + '. ' + s.titre;
    btn.onclick = () => { current = i; render(); };
    list.appendChild(btn);
  });
}

function block(title, items) {
  if (!items || !items.length) return '';
  let html = '<div class="block"><h2>' + title + '</h2><ul>';
  items.forEach(it => {
    const noBullet = it.indexOf('no-bullet') !== -1;
    html += '<li' + (noBullet ? ' style="list-style:none;margin-left:-20px"' : '') + '>' + it + '</li>';
  });
  html += '</ul></div>';
  return html;
}

function genericTable(title, table) {
  if (!table) return '';
  let html = '<div class="block"><h2>' + title + '</h2>';
  html += '<table class="scoring-table"><thead><tr>';
  table.headers.forEach(h => html += '<th>' + h + '</th>');
  html += '</tr></thead><tbody>';
  table.rows.forEach(row => {
    html += '<tr>';
    row.forEach(cell => html += '<td>' + cell + '</td>');
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function tableBlock(title, rows) {
  if (!rows || !rows.length) return '';
  let html = '<div class="block"><h2>' + title + '</h2>';
  html += '<table class="scoring-table"><thead><tr>';
  html += '<th>Tier</th><th>Statut</th><th>Score</th><th>Potentiel VCU</th><th>Action</th>';
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr><td>' + r.tier + '</td><td>' + r.statut + '</td><td>' + r.points + '</td><td>' + r.potentiel + '</td><td>' + r.action + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function formulaBlock(title, items) {
  if (!items || !items.length) return '';
  let html = '<div class="block"><h2>' + title + '</h2>';
  items.forEach(it => html += '<div class="formula">' + it + '</div>');
  html += '</div>';
  return html;
}

function sectionsBlock(sections) {
  if (!sections || !sections.length) return '';
  let html = '';
  sections.forEach(sec => {
    html += '<div class="block"><h2>' + sec.title + '</h2>';
    sec.items.forEach(it => {
      html += '<div class="formula">' + it.formula + '</div>';
      html += '<p class="formula-def">' + it.def + '</p>';
    });
    html += '</div>';
  });
  return html;
}

function renderContent() {
  const s = steps[current];
  const c = document.getElementById('content');
  let html = '';
  html += '<h1>' + s.titre + '</h1>';
  html += '<div class="num">Étape ' + s.num + ' sur 11</div>';

  if (s.isFormulaPage) {
    html += sectionsBlock(s.sections);
    html += '<div class="block"><h2>Livrable</h2><ul>';
    s.livrable.forEach(l => html += '<li>' + l + '</li>');
    html += '</ul></div>';
    html += '<div class="nav-buttons">';
    html += '<button onclick="prevStep()"' + (current === 0 ? ' disabled' : '') + '>&larr; Étape précédente</button>';
    html += '<button onclick="nextStep()"' + (current === steps.length - 1 ? ' disabled' : '') + '>Étape suivante &rarr;</button>';
    html += '</div>';
    c.innerHTML = html;
    return;
  }

  html += block('Critères', s.criteres);
  html += genericTable(s.diagnosticTitle, s.diagnosticTable);
  html += formulaBlock('Formules', s.formules);
  html += block('Critères (suite)', s.criteres2);
  html += formulaBlock('Formules (suite)', s.formules2);
  html += block('Collecte des données', s.donnees);
  html += genericTable(s.matriceTitle, s.matriceTable);
  html += block('Données à collecter par MEE', s.donneesMee);
  html += tableBlock('Grille de scoring', s.grille);

  if (s.artefact) {
    html += '<div class="block"><h2>Artefact</h2><p>' + s.artefact + '</p></div>';
  }

  html += '<div class="block"><h2>Livrable principal</h2><ul>';
  s.livrable.forEach((l, idx) => {
    html += '<li>' + l;
    if (idx === 0 && s.linkedDoc) {
      html += ' <button class="doc-link-btn" onclick="openLinkedDoc(\'' + s.linkedDoc + '\')" title="Ouvrir ' + s.linkedDocLabel + '">+</button>';
    }
    html += '</li>';
  });
  html += '</ul></div>';

  html += '<div class="block"><h2>Décision / point clé</h2>';
  if (s.decision) {
    html += '<div class="decision"><p>' + s.decision + '</p></div>';
  } else {
    html += '<p class="empty">Aucun point de décision formalisé pour cette étape.</p>';
  }
  html += '</div>';

  html += '<div class="nav-buttons">';
  html += '<button onclick="prevStep()"' + (current === 0 ? ' disabled' : '') + '>&larr; Étape précédente</button>';
  html += '<button onclick="nextStep()"' + (current === steps.length - 1 ? ' disabled' : '') + '>Étape suivante &rarr;</button>';
  html += '</div>';

  c.innerHTML = html;
}

function openLinkedDoc(path) {
  window.open(path, '_blank');
}

function prevStep() { if (current > 0) { current--; render(); } }
function nextStep() { if (current < steps.length - 1) { current++; render(); } }

function render() {
  renderList();
  renderContent();
}

render();
</script>
